<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RelaxKonOS Terminal</title>
    <style>
/*__RELAXKONOS_XTERM_CSS__*/
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0C0C0C; }
        #terminal { position: absolute; inset: 0; }
        /* The portable context menu. A native WebView surface swallows pointer events before the
           host window sees them, so copy/paste/select-all/clear have to be offered inside the page. */
        .rk-menu { position: fixed; z-index: 10; display: none; min-width: 160px; padding: 4px 0;
            background: #202020; border: 1px solid #3A3A3A; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.45);
            font-family: system-ui, "Segoe UI", sans-serif; font-size: 13px; }
        .rk-menu-item { display: block; width: 100%; padding: 6px 14px; border: 0; background: transparent;
            color: #E8E8E8; text-align: left; font: inherit; cursor: default; }
        .rk-menu-item:hover:enabled { background: #2F5FB4; }
        .rk-menu-item:disabled { color: #7A7A7A; }
        .rk-menu-separator { height: 1px; margin: 4px 0; background: #3A3A3A; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="menu" class="rk-menu"></div>
    <script>window.__relaxkonosTerminal = /*__RELAXKONOS_OPTIONS__*/;</script>
    <script>/*__RELAXKONOS_XTERM_JS__*/</script>
    <script>/*__RELAXKONOS_FIT_ADDON_JS__*/</script>
    <script>/*__RELAXKONOS_BRIDGE_JS__*/</script>
</body>
</html>
